services:
  - type: web
    name: facil-pedido-comercial
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: alembic -c alembic_gateway.ini upgrade head && uvicorn gateway.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/v1/health/live
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: 'false'
      - key: ENABLE_AUTOMATED_ORDER_CONFIRMATION
        value: 'false'
      - key: ENABLE_SALES_WRITES
        value: 'false'
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ERP_API_BASE
        sync: false
      - key: ERP_SERVICE_EMAIL
        sync: false
      - key: ERP_SERVICE_PASSWORD
        sync: false
      - key: CATALOG_DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ERP_REQUEST_TIMEOUT
        value: '15'
      - key: MAX_REQUEST_BYTES
        value: '12582912'
      - key: MAX_IMAGE_BYTES
        value: '6291456'
